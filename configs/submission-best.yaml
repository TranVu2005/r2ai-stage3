# Best measured configuration: VS-append = RD150 (configs/submission-rd150.yaml, unchanged: retrieval, builder, expand, RRF chunk
# docs, RRF doc set) + postprocess.slug_append: up to k = 20 more vi doc ids per query, ranked by BM25 over the URL slugs of vi URLs
# that have no text (crawl.db rows blocked_4xx / bot_challenge / soft404_or_home / dead_origin / network_error / pending, plus the
# nhathuoclongchau.com.vn corpus URLs absent from crawl.db; 101,259 URLs). Appended after the RD150 ids, relevant_chunks stay
# RD150's byte for byte (Final 0.2168 on 2026-10-07; score provided by the user).
# The slug candidate set (all 733,568 vi URLs for IDF / length, their status, first doc id of each candidate) is FROZEN in the pin
# file slug_append.pin (SHA256 slug_append.pin_sha256; r2ai.submit.slug_append pin, README): replay never reads state/crawl.db, so
# crawling longchau later does not change this configuration. BM25 k1, b, k and scan_depth are frozen below too.
# Replay: JSON 9c91c952...43e2e0 from RD150 136c2591...e950 (builder -> expand -> rrf -> rrf_doc_set -> slug_append).
# Read by r2ai.submit.best (scripts/run_best_retrieval.py, scripts/build_best_submission.py); code defaults are unchanged.
# Relative paths are relative to the repo root.
run_id: best-vsappend
leaderboard:
  file: out/runs/selective-check/VS-append/VS_append.zip
  final: 0.2168
  doc_f2: 0.2373
  chunk_f2: 0.1964
  source: provided by the user 2026-10-07 (Final = (0.2373 + 0.1964) / 2 = 0.21685)
queries: D:/GitHub/r2ai-stage3-old/data/raw/query.parquet

retrieval:
  # index: data/index/t256 (BGE-M3 dense + sparse, 3,909,586 chunks / 623,805 docs), chunks data/chunks/chunks_t256.parquet
  target: 256
  seed: 42                      # fixed inside run_retrieval_k100
  dense_weight: 0.7             # hybrid = 0.7 minmax(dense) + 0.3 minmax(sparse) over dense top-200 U sparse top-200
  aggregate: max
  reranker: BAAI/bge-reranker-v2-m3   # fp16, max_len 512, batch 32 (r2ai.index.bge_m3.Reranker defaults)
  reranker_snapshot: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
  # step 1: full hybrid candidate ranking (no rerank); gives the doc order after the top 100
  candidates:
    out_dir: out/runs/best/cand
    args: [--candidates, exact, --candidates-only]
  # step 2: deep rerank, tier 1 = 100 docs reranked together, tier 2 = next 50 by hybrid; resumable
  rerank:
    out_dir: out/runs/best/rerank
    args: [--candidates, exact, --tier1-docs, '100', --tier2-docs, '50', --chunk-score-docs, '0', --pair-scores]

submission:
  # caches the uploaded D50 was built from (replay); after a fresh retrieval pass --from-retrieval
  runs_dir: out/runs/deep-rerank-2026-10-05/full
  doc_ranking: out/runs/ab-2026-10-05b/cand/vi_cand.docs.parquet
  chunks_dir: data/chunks
  docs_dir: data/docs_vi
  out: out/runs/best/submission/sub_best_vsappend.zip
  # K doc 150 primary docs (ranks 1..100 deep-rerank order, 101..150 hybrid order), each expanded to its whole
  # doc_ids_group; full chunks (whole answer if inside the body, else whole body; no cut) for the top 50 docs.
  args: [--k-doc, '100', --k-doc-total, '150', --k-chunk, '50', --chunk-mode, full, --dedupe-scope, doc]
  max_zip_bytes: 104857600      # 100 MiB ceiling; LB accepted 97.04 MiB, 110 MiB never finished uploading
  base_json_sha256: 2f10b78ac17f4eafdd5fe1b0b207260b062f17b29f4fcc3ee1a4b364b3c36544   # builder output = D50
  expand_json_sha256: 6c27d3f327fdcc5dac248cdaf80cf1be941fbff22666b25dbd07f32903f01106 # after expand = uploaded H1-expand
  rrf_json_sha256: ff035b8ba7eea0a177932850d3a9cc9f1ffbcbe8297b8a8740bae23bd949d1c3    # after RRF chunk docs = uploaded RRF
  rrf_doc_set_json_sha256: 136c259145c6fa134bcd5d4a877575088e28346ef43636afc87d2e283508e950   # after RRF doc set = uploaded RD150
  expected_json_sha256: 9c91c952863c4e33b992053d665d547ba1f483cd0be487047386ba09af43e2e0   # after slug_append = uploaded VS-append
  expected_json_bytes: 402631653
  uploaded_zip_sha256: 48da9d87a1140a732eb06caa5c5573a6bd68d877f155067718831f01930853fe   # out/runs/selective-check/VS-append (deflate level 9; zip bytes carry the file mtime, the JSON SHA256 is the gate)
postprocess:
  expand_clusters:
    enabled: true                 # false (or no postprocess key) = plain D50
    clusters: out/runs/H1/clusters.parquet   # python -m r2ai.dupes.scan features/cluster (README)
    scope: content                # clusters not flagged boilerplate
  rrf_chunk_docs:
    enabled: true                 # false (or no key) = H1-expand chunks (top 50 of the D50 order)
    k: 60
    reranker_cache: out/runs/rerank200/full/vi_k100.parquet          # tier 1 = 200 rerank, ranks 1..200
    hybrid_ranks: out/runs/ab-2026-10-05b/cand/vi_cand.docs.parquet  # = submission.doc_ranking (D50 hybrid order)
    missing_rank: 201             # reranker rank of a primary doc absent from reranker_cache (none on 2026-10-06)
  rrf_doc_set:
    enabled: true                 # false (or no key) = RRF (relevant_docs of H1-expand)
    k: 60
    k_docs: 150                   # docs taken from the pool before the cluster expand
    reranker_cache: out/runs/rerank200/full/vi_k100.parquet          # the pool (all its docs) and their reranker ranks
    hybrid_ranks: out/runs/ab-2026-10-05b/cand/vi_cand.docs.parquet  # every pool doc has one (0 missing on 2026-10-06)
  slug_append:
    enabled: true                 # false (or no key) = RD150
    pin: out/runs/best-vsappend/slug_pool_pin.parquet   # frozen slug universe (python -m r2ai.submit.slug_append pin; README)
    pin_sha256: 196f2e50cd914de4bf55c812519ec5d05afde1ea31a1608b207442a24b00371f
    k: 20                         # doc ids appended per query (default 20 when absent); change together with expected_json_sha256
    k1: 1.2                       # BM25 over de-accented URL slug tokens (r2ai.selective.bm25 constants)
    b: 0.75
    scan_depth: 400               # candidates scanned per query while looking for k ids not already in relevant_docs
